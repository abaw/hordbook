<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hordbook favicon: the app icon's book-with-tile motif, simplified for 16-32 px. -->
  <rect width="64" height="64" rx="14" fill="#111318"/>
  <!-- spine -->
  <rect x="9" y="9" width="7" height="42" rx="2" fill="#1c2029"/>
  <path d="M9 17h7M9 20h7M9 40h7M9 43h7" stroke="#e08a4f" stroke-width="1.5"/>
  <!-- cover -->
  <rect x="15.5" y="9.5" width="40" height="41" fill="#111318" stroke="#e08a4f" stroke-width="2"/>
  <!-- page block -->
  <rect x="15" y="50" width="41" height="6" rx="1" fill="#f6f4ef"/>
  <!-- letter tile -->
  <rect x="26" y="18" width="20" height="20" fill="#e08a4f"/>
  <text x="36" y="34.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#f6f4ef">H</text>
</svg>
